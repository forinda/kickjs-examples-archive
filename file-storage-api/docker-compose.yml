# docker compose up --build — MinIO (S3-compatible), a one-off job that creates
# the bucket, and the API on the s3 driver. API_KEY and SIGNING_SECRET are
# required (32+ chars each): export them or put them in .env.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  create-bucket:
    # The server image ships the mc client.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ['sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/files
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      minio: { condition: service_healthy }

  app:
    build: .
    environment:
      STORAGE_DRIVER: s3
      S3_BUCKET: files
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      API_KEY: ${API_KEY:?set API_KEY}
      SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET}
    ports: ['${APP_PORT:-3000}:3000']
    depends_on:
      create-bucket: { condition: service_completed_successfully }

volumes:
  minio-data:
